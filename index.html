{t:'When I was three or four years old, my father took me to the beach in California. The waves knocked me down and swept over me. I was buried in water, and my breath was gone. I was frightened.',q:[['How old was the author at the time?','Three or four years old.'],['Where did the incident happen?','At a beach in California, where he had gone with his father.'],['What happened to him?','The waves knocked him down and buried him in water.'],['How did the experience affect him?','It left him with a lasting fear of water.'],['Why was this fear a handicap later?','It kept him from swimming, canoeing and fishing, activities he loved.'],['What does “buried in water” suggest?','Helplessness, as if he were completely covered and trapped.']],m:[['At what age did the beach incident happen?',['Ten','Three or four','Seven','Fifteen'],1],['The incident took place in…',['Florida','Hawaii','California','Texas'],2],['The experience left him with…',['Fear of water','Love of waves','Confidence','Pride'],0]]},
{t:'I was ten or eleven. I went to the Y.M.C.A. pool alone. Suddenly a big bully of a boy picked me up and threw me into the deep end of the pool, laughing as he did so.',q:[['Where did this incident take place?','At the Y.M.C.A. pool in Yakima.'],['Who threw him into the water?','A big boy, a bully, who did it for fun.'],['How did the bully behave?','Cruelly and carelessly, laughing at the child’s fear.'],['Why was the deep end so dangerous?','The author could not swim, and the water was about nine feet deep.'],['What does the incident show about the author?','He was a small, timid boy who had no one to protect him.'],['What is the writer’s attitude to the bully?','He does not blame him; he simply describes it plainly.']],m:[['The pool belonged to the…',['School','Y.M.C.A.','Club house','Hotel'],1],['The boy who threw him was a…',['Friend','Teacher','Bully','Lifeguard'],2],['The author could not…',['Run','Swim','Climb','Shout'],1]]},
{t:'The moment my feet touched I made what I thought was a great spring upwards. I imagined I would bob to the surface like a cork. Instead I came up slowly. I opened my eyes and saw nothing but water. I was suffocating. I tried to yell but no sound came out.',q:[['What did he hope would happen?','That he would shoot up like a cork and reach the surface.'],['What really happened?','He rose slowly and found himself still under water.'],['Which figure of speech is “bob like a cork”?','A simile.'],['How does the author show his panic?','He opens his eyes in terror, is suffocating and cannot even yell.'],['What does this show about fear?','Fear can paralyse a person and rob him of voice and judgment.'],['What was the effect of this experience?','He developed an even greater terror of water for years.']],m:[['He expected to rise like a…',['Bird','Balloon','Cork','Arrow'],2],['He tried to…',['Yell','Laugh','Sing','Sleep'],0],['The mood of the passage is…',['Terror','Joy','Calm','Pride'],0]]},
{t:'The instructor put a belt around my waist. A rope attached to the belt went through a pulley that ran on an overhead cable. Bit by bit he built a swimmer. Piece by piece he built my confidence. Later I shouted with joy, for I had finally conquered the old terror.',q:[['What did the instructor tie around him?','A belt, with a rope that ran through a pulley on an overhead cable.'],['How did the rope help?','It held him up in the water so he could practise without fear.'],['Why did the training take so long?','He had to overcome his fear along with learning the strokes.'],['What is the meaning of “bit by bit he built a swimmer”?','The instructor developed his skill gradually.'],['Why did he shout with joy?','He had finally conquered his old fear of water.'],['What lesson does the chapter give?','Fear can be defeated through patience, practice and will.']],m:[['The instructor used a…',['Boat','Belt and pulley','Raft','Float'],1],['The author shouted with joy because…',['He won a prize','He conquered fear','He met a friend','He crossed a river'],1],['The passage teaches…',['Courage and perseverance','Laziness','Revenge','Fear'],0]]}

3:[
{t:'The peddler believed the whole world was a big rattrap. It offered riches and joys, shelter and food, heating and clothing, all as bait. The moment anyone touched the bait, the trap closed.',q:[['What was the peddler’s business?','He made and sold small rattraps of wire.'],['How did he see the world?','As a big rattrap that offered bait to tempt people.'],['What are the baits listed?','Riches, joys, shelter, food, heating and clothing.'],['What happens when one touches the bait?','The trap closes and the person is ruined.'],['What kind of life did the peddler lead?','A poor, lonely, wandering life without a home.'],['What does the rattrap symbolise?','The lures of the world that lead to misery.']],m:[['The peddler sold…',['Rattraps','Knives','Needles','Brooms'],0],['The world, to him, was…',['A garden','A rattrap','A palace','A prison'],1],['The bait stands for…',['Temptations','Food only','Gold only','Friendship'],0]]},
{t:'The ironmaster looked closely at the ragged man and exclaimed that he must be Captain von Stahle, an old regimental comrade. The peddler did not contradict him. He was cold and hungry and feared he would be thrown out into the winter night.',q:[['Who did the ironmaster think the peddler was?','Captain von Stahle, an old comrade.'],['Why did the peddler not deny it?','He was cold and hungry and wanted shelter.'],['What does his silence show?','He is practical and afraid, and not yet a reformed man.'],['What did the ironmaster offer?','An invitation to come to the manor for Christmas.'],['Why did the peddler refuse at first?','He feared the ironmaster might be trying to trap him.'],['What is the irony in this scene?','Two very different men are mistaken for each other.']],m:[['The ironmaster mistook him for…',['A thief','Captain von Stahle','A policeman','A beggar'],1],['The peddler kept quiet out of…',['Pride','Hunger and fear','Anger','Joy'],1],['The ironmaster invited him for…',['Christmas','A trial','A sale','A game'],0]]},
{t:'Edla Willmansson spoke gently to the stranger. Even after she and her father found he was only a poor peddler, she insisted he should stay. She had invited him to share their Christmas, and she would not take back her invitation.',q:[['Who is Edla Willmansson?','The ironmaster’s kind young daughter.'],['How did she treat the peddler?','With gentleness and trust.'],['Why did she not send him away?','She had promised him Christmas hospitality and kept her word.'],['What does this reveal about her character?','She is kind, compassionate and firm in her principles.'],['How does the peddler react to her kindness?','He is moved, and it awakens his better self.'],['What contrast is drawn here?','Her trust against the father’s impulsiveness and the peddler’s cynicism.']],m:[['Edla is the ironmaster’s…',['Daughter','Sister','Wife','Maid'],0],['She treated the peddler…',['Rudely','Kindly','Cruelly','Coldly'],1],['She refused to…',['Take back her invitation','Help him','Speak to him','Meet him'],0]]},
{t:'On Christmas morning they found a small package. Inside lay one of the peddler’s rattraps, three wrinkled ten-kronor notes, and a letter signed Captain von Stahle. He had returned the stolen money, and the rattrap was a Christmas gift to the young lady who had trusted him.',q:[['What did the package contain?','A rattrap, three ten-kronor notes and a letter.'],['What was the money?','The thirty kronor he had stolen from the crofter.'],['Why was the letter signed Captain von Stahle?','He wanted to show that Edla’s trust had raised him from his old life.'],['What did the rattrap gift mean?','A sign that he had escaped the world’s trap, with her help.'],['How had the peddler changed?','From a thief to an honest man who understood kindness.'],['What is the theme of the story?','Kindness and trust can reform even the lowest.']],m:[['The notes returned were worth…',['30 kronor','20 kronor','50 kronor','10 kronor'],0],['The letter was signed…',['Nils Olof','Edla','Captain von Stahle','The ironmaster'],2],['The story shows that…',['Kindness changes people','Money rules','Traps work','Poverty is sin'],0]]}

{t:'Rajkumar Shukla, a poor peasant of Champaran, followed Gandhi from place to place. He begged him to visit his district and see the sufferings of the indigo sharecroppers for himself.',q:[['Who was Rajkumar Shukla?','A poor, resolute peasant from Champaran.'],['What did he want from Gandhi?','To visit Champaran and help the sharecroppers.'],['How did he show persistence?','He followed Gandhi everywhere until he agreed.'],['What was the peasants’ main grievance?','They were forced to grow indigo on part of their land.'],['What does this show about Shukla?','He was determined and loyal to his people.'],['What did Gandhi decide?','To go to Champaran as soon as his schedule allowed.']],m:[['Shukla was a…',['Lawyer','Poor peasant','Landlord','Judge'],1],['He lived in…',['Champaran','Ahmedabad','Delhi','Lucknow'],0],['The peasants were forced to grow…',['Wheat','Indigo','Cotton','Rice'],1]]},
{t:'Gandhi had hardly settled in Champaran when an official notice arrived ordering him to leave the district at once. He refused. He said he had come to render humanitarian and national service to the sharecroppers and would not depart until that work was finished.',q:[['What did the notice order?','Gandhi was to leave the district immediately.'],['How did Gandhi respond?','He refused to obey and prepared for civil disobedience.'],['Why did he refuse?','He felt bound by duty to serve the peasants.'],['What does this show about his character?','Courage, firm principles and non-violent resistance.'],['What action did the authorities take?','They summoned him to appear in court.'],['Why was this important to the freedom movement?','It was the first lesson in civil disobedience.']],m:[['The notice told Gandhi to…',['Leave Champaran','Meet the king','Pay a fine','Study law'],0],['Gandhi chose to…',['Obey','Resist non-violently','Run away','Ask for money'],1],['His aim was…',['Service to peasants','Wealth','Fame','Office'],0]]},
{t:'News of his summons to court spread through the villages. On the day of the hearing thousands of peasants gathered outside the courthouse. They stood in silence, yet their numbers alarmed the officials. The government, faced with such unexpected unity, dropped the case.',q:[['Why did thousands gather at the court?','To support Gandhi, whom they now trusted.'],['How did the crowd behave?','Quietly and peacefully, without violence.'],['Why were the officials alarmed?','They had never seen such unity among the peasants.'],['What did the government do?','It withdrew the case against Gandhi.'],['What did this show about the peasants?','They had lost their fear of the British.'],['What was the significance of this event?','It showed the power of peaceful mass support.']],m:[['The crowd outside the court was…',['Silent and large','Violent','Small','Noisy'],0],['The government…',['Fined him','Dropped the case','Jailed him','Fled'],1],['The peasants lost…',['Their land','Their fear','Their crops','Their leader'],1]]},
{t:'After long negotiations the planters agreed to a refund. Gandhi accepted only twenty-five per cent, saying the sum mattered less than the landlords’ admission that they had acted wrongly. He also began constructive work: schools, lessons in cleanliness and a doctor for the sick.',q:[['What did the planters finally agree to?','To refund part of the money they had taken.'],['How much did Gandhi accept?','Twenty-five per cent.'],['Why was the amount not important?','The landlords’ admission of guilt was what mattered.'],['What constructive work did he begin?','Schools, cleanliness drives and medical help.'],['What did the peasants gain from the movement?','Self-reliance and freedom from the planters’ fear.'],['What does the chapter teach?','Self-reliance and non-violent action can bring change.']],m:[['Gandhi accepted what share of the refund?',['25 per cent','50 per cent','75 per cent','100 per cent'],0],['He also set up…',['Factories','Schools and clinics','Banks','Courts'],1],['The real victory was…',['Money','Lost fear','Land','Titles'],1]]}

{t:'Kothamangalam Subbu was officially Number Two at the studio, yet his influence was far greater. He was a poet who could compose on the spot, an actor, and a man of endless resource.',q:[['Who was Subbu?','The second-in-command at Gemini Studios, a poet and actor.'],['What was his special skill?','Composing verse instantly.'],['What did he do when a scene failed?','He supplied an idea that usually worked.'],['Why was his influence so large?','His talent and closeness to the boss.'],['Who was the boss of the studio?','S. S. Vasan.'],['What does Subbu stand for in the chapter?','Creative talent inside commercial cinema.']],m:[['Subbu’s rank was…',['One','Two','Five','Ten'],1],['He was a…',['Poet','Driver','Cook','Doctor'],0],['The studio’s boss was…',['Vasan','Spender','Eco','Gandhi'],0]]},
{t:'The office boy complained that his talents were wasted. He believed that with a chance he might have become a star, and that Subbu had risen only by pleasing the boss.',q:[['What did the office boy complain about?','That his talents were never used.'],['What did he believe about himself?','That he could have become a star.'],['What did he think of Subbu?','That Subbu rose through flattery.'],['What does this reveal about the studio?','A sharp hierarchy and much frustrated ambition.'],['What is the author’s tone here?','Gentle, humorous and observant.'],['What larger idea does it show?','Many gifted people go unrecognised.']],m:[['The office boy felt his talents were…',['Rewarded','Wasted','Famous','Shared'],1],['He believed Subbu won by…',['Flattery','Poetry','Acting','Luck'],0],['The tone is…',['Gentle humour','Bitter hatred','Fear','Pride'],0]]},
{t:'The English poet Stephen Spender visited the studio. Most people did not recognise him; they had expected a politician or a film celebrity. The quiet man walked among them almost unseen.',q:[['Who visited Gemini Studios?','Stephen Spender, the English poet.'],['Why did people not recognise him?','They knew films, not world literature.'],['What did they expect instead?','A politician or film celebrity.'],['What does it show about the studio?','Its people lived apart from the literary world.'],['What was Spender editing?','The magazine Encounter.'],['What contrast is created?','Between commercial cinema and serious letters.']],m:[['Spender was a…',['Painter','Singer','Poet','Actor'],2],['The staff were…',['Excited','Ignorant of him','Angry','Afraid'],1],['The visit shows a…',['Gap between two worlds','Film award','Rivalry','Fire'],0]]}

{t:'Umberto Eco explained that he was a professor who wrote novels on Sundays. He filled the interstices of his academic schedule with writing.',q:[['What is Eco’s main profession?','University professor and scholar.'],['When does he write novels?','On Sundays and in free gaps.'],['What does “interstices” mean?','Small gaps between larger tasks.'],['What does this show about his work habit?','He uses spare time well.'],['How does he rank novel-writing?','As a side activity.'],['What impression does he give?','Modest and disciplined.']],m:[['Eco is a…',['Professor','Singer','Judge','Doctor'],0],['He writes novels on…',['Mondays','Sundays','Fridays','Holidays only'],1],['Interstices are…',['Gaps','Books','Rules','Prizes'],0]]},
{t:'He said he had started writing fiction almost by accident. When The Name of the Rose became an international success he was surprised, and he still thought of himself first as a teacher.',q:[['How did Eco begin writing fiction?','Almost by accident.'],['Which novel made him famous?','The Name of the Rose.'],['How did he react to its success?','With surprise.'],['How does he still describe himself?','As a teacher first.'],['What does this show about him?','Humility.'],['What kind of success was it?','International.']],m:[['He began fiction…',['By chance','By force','By contest','By order'],0],['His famous novel is…',['The Island','The Name of the Rose','Baudolino','Prague'],1],['He was…',['Surprised','Angry','Bored','Greedy'],0]]},
{t:'Asked whether he was a novelist who taught or a professor who wrote, he preferred the second description. Fame, he suggested, was less interesting than the steady rhythm of scholarly life.',q:[['Which description does Eco prefer?','Professor who writes.'],['What does he think of fame?','It is less interesting than scholarship.'],['What does he value?','The steady rhythm of academic life.'],['What does this reveal about him?','He is not swayed by popularity.'],['Why is the interview interesting?','It shows a writer with a down-to-earth attitude.'],['What quality does the interviewer show?','Curiosity and politeness.']],m:[['Eco prefers to be called a…',['Professor','Novelist','Actor','Monk'],0],['He finds fame…',['Less interesting','Most exciting','Necessary','Easy'],0],['He values…',['Scholarship','Wealth','Applause','Travel'],0]]},
{t:'He spoke about the loose way “postmodern” is used. Almost any difficult or playful book can be labelled postmodern, he noted, and the term has become so broad that it sometimes means very little.',q:[['What did Eco criticise?','The loose use of the word postmodern.'],['Which books get the label?','Almost any difficult or playful book.'],['What is the result?','The word loses meaning.'],['How does he sound here?','Thoughtful and slightly amused.'],['What does this show about language?','Words can become vague through overuse.'],['What lesson follows?','Use terms with care.']],m:[['The word he discusses is…',['Postmodern','Classic','Epic','Romantic'],0],['He thinks it is…',['Too loose','Precise','Rare','New'],0],['Overuse makes a word…',['Stronger','Meaningless','Famous','Short'],1]]}

{t:'Their father worked long hours and had little patience for fantasy. The house was modest and money was tight. Sophie knew all this, yet she preferred the brighter pictures she invented.',q:[['What is the father’s attitude?','Impatient with fantasy.'],['What was the family’s condition?','Modest and short of money.'],['Why does Sophie invent stories?','To escape her dull reality.'],['What does this show about her life?','Limited and hard.'],['What does the author suggest?','Dreams can be a refuge.'],['What is the tone?','Sympathetic.']],m:[['The father is…',['Hard-working','Lazy','Rich','Absent'],0],['The home is…',['Modest','Palace','Hotel','Farm'],0],['Sophie’s stories are an…',['Escape','Crime','Exam','Job'],0]]},

{t:'Polished cars rush past with their minds ahead. If any stops, it is only to complain that the stand spoils the scenic beauty, or to ask for directions.',q:[['How do the cars pass?','Quickly, without a glance.'],['Why do some stop?','To complain or ask the way.'],['What does this show about city people?','They are selfish and unfeeling.'],['What does “polished” suggest?','Wealth, outward gloss and shallowness.'],['What do the travellers overlook?','The poor people’s need.'],['What is the tone?','Bitter irony.']],m:[['Travellers stop only to…',['Buy','Complain','Pray','Sleep'],1],['The word “polished” suggests…',['Shallow wealth','Poverty','Honesty','Fear'],0],['City people are shown as…',['Insensitive','Kind','Generous','Shy'],0]]},

function shuf(m){const x=m[1].map((_,i)=>i);for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return [m[0],x.map(i=>m[1][i]),x.indexOf(m[2])]}
function showFull(i){
  cur=i;nav();

  let h=`<h1 class="serif" style="margin:0">${c[1]}</h1><p style="color:var(--mut);margin:2px 0 0">${c[0]} · ${FULL[i].length} extracts</p>`;
  FULL[i].forEach((e,n)=>{
    h+=`<div class="card"><div class="tag">EXTRACT ${n+1}</div><p class="ext">${e.t}</p>`;
    e.q.forEach((q,k)=>{h+=`<div class="q"><b>Q${k+1}.</b> ${q[0]}<div class="ans">${q[1]}</div></div>`});
    h+=`<div class="mcq"><b>MCQs</b>`;
    e.m.forEach((m0,k)=>{const m=shuf(m0);h+=`<div style="margin-top:10px"><b>${k+1}.</b> ${m[0]}<div>`;m[1].forEach((o,j)=>{h+=`<button class="opt" onclick="pick(this,${m[2]},${j})">${L[j]}. ${o}</button>`});h+=`</div></div>`});
    h+=`</div></div>`;
  });
  document.getElementById("view").innerHTML=h;
  document.getElementById("aside").classList.remove("open");
  window.scrollTo(0,0);
}

  const hr=new Date().getHours();
  const g=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  const quotes=["Small steps every day beat last-minute cramming.","Read the extract twice. The answer is often hiding in it.","One chapter today is one worry fewer on exam day.","You don’t have to be perfect. You just have to keep going."];
  const q=quotes[new Date().getDate()%quotes.length];
  const done=Object.keys(FULL).length;
  const ext=Object.values(FULL).reduce((s,a)=>s+a.length,0)+(D.length-done);
  const meta={Prose:["📖","Flamingo · stories and essays","#6366f1"],Poetry:["🌿","Flamingo · poems","#10b981"],Vistas:["🧭","Vistas · supplementary reader","#f59e0b"]};
  let s="";
  SECS.forEach(n=>{
    const m=meta[n];
    s+=`<div class="sec" style="--c:${m[2]}"><h3>${m[0]} ${n}</h3><small>${m[1]}</small><div class="chips">`;
    D.forEach((c,i)=>{if(c[0]===n)s+=`<button class="chip" onclick="show(${i})">${c[1]}${FULL[i]?"<i>✓</i>":""}</button>`});
    s+=`</div></div>`;
  });
  document.getElementById("view").innerHTML=`<div class="hero2"><p class="hi">${g} 👋</p><h1>Ready to ace your English extracts?</h1><p class="sub">Read the passage, try the questions, then test yourself with quick MCQs.</p><div class="btns"><button class="btn w" onclick="show(0)">Start practising</button><button class="btn g" onclick="show(Math.floor(Math.random()*D.length))">Surprise me 🎲</button></div><div class="quote">“${q}”</div></div><div class="stats"><div class="stat"><b>${D.length}</b><span>Chapters</span></div><div class="stat"><b>${ext}</b><span>Extracts</span></div><div class="stat"><b>${done}</b><span>Fully complete ✓</span></div></div><h2 class="h2">Pick a chapter</h2><div class="secgrid">${s}</div><p class="note">A tick means the chapter has 4 extracts with full questions and MCQs. Passages are adapted or summarised, so check the original text before exams.</p>`;
}
function homeOld(){
  cur=-1;nav();
  document.getElementById("view").innerHTML=`<div class="hero"><h1 class="serif" style="margin:0;font-size:36px">Extracts Hub</h1><p>${D.length} chapters · full chapters (4 extracts, 6–7 questions, 3–4 MCQs each) are done for The Last Lesson and Lost Spring; the rest are being upgraded</p><button onclick="side()">Open chapters</button></div><p class="note">Passages are adapted or summarised and may not match the textbook wording exactly. Check the original text before exams.</p>`;
}
function pick(btn,right,i){
  const box=btn.parentNode;
  [...box.querySelectorAll(".opt")].forEach((b,j)=>{b.disabled=true;if(j===right)b.classList.add("ok");else if(b===btn)b.classList.add("bad")});
}
function show(i){
  if(FULL[i])return showFull(i);
  cur=i;nav();
  const c=D[i];
  let h=`<h1 class="serif" style="margin:0">${c[1]}</h1><p style="color:var(--mut);margin:2px 0 0">${c[0]}</p><div class="card"><div class="tag">EXTRACT</div><p class="ext">${c[2]}</p>`;
  c[3].forEach((q,k)=>{h+=`<div class="q"><b>Q${k+1}.</b> ${q[0]}<div class="ans">${q[1]}</div></div>`});
  h+=`<div class="mcq"><b>MCQs</b>`;
  c[4].forEach((m,k)=>{h+=`<div style="margin-top:10px"><b>${k+1}.</b> ${m[0]}<div>`;m[1].forEach((o,j)=>{h+=`<button class="opt" onclick="pick(this,${m[2]},${j})">${L[j]}. ${o}</button>`});h+=`</div></div>`});
  h+=`</div></div>`;
  document.getElementById("view").innerHTML=h;
  document.getElementById("aside").classList.remove("open");
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
