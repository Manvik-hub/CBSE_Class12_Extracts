"M. Hamel mounted his chair, and, in the same grave and gentle tone which he had used to me, said, “My children, this is the last lesson I shall give you. The order has come from Berlin to teach only German in the schools of Alsace and Lorraine. The new master comes tomorrow. This is your last French lesson. I want you to be very attentive.” What a thunderclap these words were to me!",

function toggleSide(){document.getElementById("side").classList.toggle("-translate-x-full");document.getElementById("overlay").classList.toggle("hidden");}

function renderChapter(id){
  const ch=CHAPTERS.find(c=>c.id==id);
  const exs=EXTRACTS[id]||[];
  let h=`<h1 class="serif text-3xl font-bold">${ch.name}</h1><p class="text-slate-500 mb-4">${ch.sec} · ${exs.length} extracts</p>`;
  exs.forEach((ex,i)=>{
    h+=`<div class="extract-card bg-white p-4 rounded-xl mb-5 shadow-sm"><p class="text-xs text-indigo-600 font-bold">EXTRACT ${i+1}</p><p class="italic mt-1">"${ex.t}"</p>`;
    ex.q.forEach((qa,qi)=>h+=`<div class="mt-3"><b>Q${qi+1}.</b> ${qa[0]}<p class="ans mt-1 p-2 text-sm">${qa[1]}</p></div>`);
    if(ex.mcq){
      h+=`<div class="mcq-box mt-4 p-3 rounded"><b>MCQs</b>`;
      ex.mcq.forEach((m,mi)=>{
        h+=`<div class="mt-2"><b>${mi+1}.</b> ${m.q}<div class="ml-3 text-sm">`;
        m.o.forEach((o,oi)=>h+=`<div>${String.fromCharCode(65+oi)}. ${o}</div>`);
        h+=`</div><p class="ans p-1 text-sm mt-1">Answer: ${m.a}</p></div>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  document.getElementById("view").innerHTML=h;
  if(window.innerWidth<768) toggleSide();
}
function init(){
  const side=document.getElementById("side");
  side.innerHTML="";
  ["Prose","Poetry","Vistas"].forEach(sec=>{
    side.innerHTML+=`<div class="text-xs uppercase text-slate-400 mt-3 px-2">${sec}</div>`;
    CHAPTERS.filter(c=>c.sec===sec).forEach(c=>{
      const n=(EXTRACTS[c.id]||[]).length;
      side.innerHTML+=`<button onclick="renderChapter(${c.id})" class="w-full text-left px-3 py-2 hover:bg-indigo-50 rounded text-sm flex justify-between"><span>${c.name}</span><span class="text-xs bg-indigo-100 px-2 rounded-full">${n}</span></button>`;
    });
  });
  const total=Object.values(EXTRACTS).reduce((s,a)=>s+(a?a.length:0),0);
  document.getElementById("view").innerHTML=`<div class="hero text-white p-8 rounded-3xl"><h1 class="serif text-4xl font-bold">Extracts Hub</h1><p class="mt-2">${total} extracts · 4 per chapter · Questions + MCQs</p><button onclick="toggleSide()" class="mt-4 bg-white text-indigo-700 px-5 py-2 rounded-full">Open Chapters</button></div>`;
}
